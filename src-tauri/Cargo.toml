[package]
name = "gpteasy"
version = "1.4.1"
description = "安全管理当前用户 Codex 环境"
authors = ["GPTEasy contributors"]
edition = "2024"
rust-version = "1.85"

[features]
native-linux-acceptance = []
wsl-guest-harness = []

[lib]
name = "gpteasy_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "gpteasy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
base64 = "0.22"
futures-util = "0.3"
minisign-verify = "0.2.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
tauri = { version = "2.8", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml_edit = "0.23"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
minisign-verify = "0.2.5"
tempfile = "3.15"

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
