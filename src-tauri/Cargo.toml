[package]
name = "gpteasy"
version = "0.1.0"
description = "安全管理当前用户 Codex 环境"
authors = ["GPTEasy contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "gpteasy_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "gpteasy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.8", features = [] }
thiserror = "2.0"
toml_edit = "0.23"

[dev-dependencies]
tempfile = "3.15"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
