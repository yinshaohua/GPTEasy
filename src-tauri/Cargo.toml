[package]
name = "gpteasy"
version = "0.1.0"
description = "安全管理当前用户 Codex 环境"
authors = ["GPTEasy contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "gpteasy_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "gpteasy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.8", features = [] }
tauri-plugin-clipboard-manager = "2"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml_edit = "0.23"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
