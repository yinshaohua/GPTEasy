[package]
name = "gpteasy-spike-004"
version = "0.1.0"
description = "Tauri tray and Codex process detection spike"
edition = "2021"

[lib]
name = "gpteasy_spike_004_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gpteasy-spike-004"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
