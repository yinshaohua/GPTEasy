<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPTEasy 更新 Spike</title>
    <style>
      :root { font-family: Inter, "Segoe UI", sans-serif; color: #14213d; background: #f3f5f8; }
      body { margin: 0; }
      main { width: min(720px, calc(100% - 40px)); margin: 60px auto; }
      section { padding: 24px; border: 1px solid #d9e0e8; border-radius: 16px; background: white; }
      button { border: 0; border-radius: 10px; padding: 10px 16px; color: white; background: #1769aa; font-weight: 700; cursor: pointer; }
      button[disabled] { opacity: 0.45; cursor: not-allowed; }
      #install { background: #9b3e21; margin-left: 8px; }
      pre { min-height: 120px; margin-top: 18px; padding: 14px; border-radius: 10px; background: #edf1f5; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <h1>显式确认更新</h1>
      <p>检查更新不会下载；只有用户再次确认“下载并安装”后才进入安装流程。</p>
      <section>
        <button id="check">检查更新</button>
        <button id="install" disabled>下载并安装</button>
        <pre id="status">尚未检查。</pre>
      </section>
    </main>
    <script>
      const invoke = window.__TAURI__.core.invoke;
      const status = document.querySelector("#status");
      const install = document.querySelector("#install");
      document.querySelector("#check").addEventListener("click", async () => {
        install.disabled = true;
        status.textContent = "正在检查……";
        try {
          const update = await invoke("check_update");
          if (update) {
            status.textContent = JSON.stringify(update, null, 2);
            install.disabled = false;
          } else {
            status.textContent = "当前已是最新版本。";
          }
        } catch (error) {
          status.textContent = `检查失败：${error}`;
        }
      });
      install.addEventListener("click", async () => {
        if (!window.confirm("确认下载并安装此更新？应用可能需要重启。")) return;
        install.disabled = true;
        status.textContent = "正在下载并安装……";
        try {
          await invoke("install_update");
          status.textContent = "安装完成，正在重启。";
        } catch (error) {
          status.textContent = `安装失败：${error}`;
        }
      });
    </script>
  </body>
</html>
