[package]
name = "gpteasy-spike-005"
version = "0.1.0"
description = "Tauri installer and updater spike"
edition = "2021"

[lib]
name = "gpteasy_spike_005_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gpteasy-spike-005"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-updater = "2.10.1"
