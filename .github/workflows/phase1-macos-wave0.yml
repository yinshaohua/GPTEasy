name: Phase 1 macOS Wave 0

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave0:
    name: zsh contract (${{ matrix.expected_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            expected_arch: arm64
          - runner: macos-15-intel
            expected_arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact native host
        shell: zsh {0}
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_REVISION" ]]
          [[ "$(uname -s)" == "Darwin" ]]
          [[ "$(uname -m)" == "$EXPECTED_ARCH" ]]
          major=$(/usr/bin/sw_vers -productVersion | /usr/bin/awk -F. '{print $1}')
          (( major >= 14 ))

      - name: Parse every zsh contract
        shell: zsh {0}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            zsh -n "$script"
          done < <(find scripts/contracts -type f -name '*.zsh' -print0)

      - name: Run macOS Codex and host contract fixtures
        shell: zsh {0}
        run: |
          set -euo pipefail
          zsh scripts/contracts/test-macos-contract-probes.zsh

      - name: Run macOS package verifier fixtures when present
        shell: zsh {0}
        run: |
          set -euo pipefail
          verifier=scripts/contracts/test-macos-package-verifier.zsh
          if [[ -f "$verifier" ]]; then
            zsh -n "$verifier"
            zsh "$verifier"
          fi
