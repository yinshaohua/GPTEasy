name: Phase 1 macOS Evidence

on:
  workflow_call:
    secrets:
      APPLE_CERTIFICATE:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      APPLE_SIGNING_IDENTITY:
        required: true
      APPLE_API_ISSUER:
        required: true
      APPLE_API_KEY:
        required: true
      APPLE_API_KEY_ID:
        required: true
  workflow_dispatch:

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

jobs:
  wave0:
    uses: ./.github/workflows/phase1-macos-wave0.yml

  macos-evidence:
    name: ${{ matrix.job_name }}
    needs: wave0
    strategy:
      fail-fast: false
      matrix:
        include:
          - job_name: macos-apple-silicon
            runner: macos-15
            expected_arch: arm64
            smoke_arch: aarch64
            rust_target: aarch64-apple-darwin
          - job_name: macos-intel
            runner: macos-15-intel
            expected_arch: x86_64
            smoke_arch: x86_64
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GPTEASY_PRIVATE_DIR: ${{ runner.temp }}/gpteasy-private-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.expected_arch }}
      GPTEASY_EVIDENCE_DIR: ${{ runner.temp }}/gpteasy-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.expected_arch }}
      GPTEASY_ARTIFACT_PATH: ${{ runner.temp }}/GPTEasy-${{ matrix.expected_arch }}.zip
      GPTEASY_EVIDENCE_BUNDLE: ${{ runner.temp }}/phase1-macos-${{ matrix.expected_arch }}-evidence.zip

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@200ca3772d6bf0f748598244a5eb52a1a57e3c54
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact native runner
        shell: zsh {0}
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
          EXPECTED_SMOKE_ARCH: ${{ matrix.smoke_arch }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_REVISION" ]]
          [[ "$(uname -s)" == "Darwin" ]]
          [[ "$(uname -m)" == "$EXPECTED_ARCH" ]]
          major=$(/usr/bin/sw_vers -productVersion | /usr/bin/awk -F. '{print $1}')
          (( major >= 14 ))
          [[ "${RUNNER_ENVIRONMENT:-}" == "github-hosted" ]]
          /bin/mkdir -p "$GPTEASY_PRIVATE_DIR" "$GPTEASY_EVIDENCE_DIR"
          /bin/chmod 700 "$GPTEASY_PRIVATE_DIR" "$GPTEASY_EVIDENCE_DIR"

      - name: Preflight read-only GitHub evidence APIs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoProfile -File scripts/contracts/preflight-gh-evidence.ps1 `
            -Repository yinshaohua/GPTEasy `
            -MinimumVersion 2.49.0
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Setup exact Node runtime
        uses: actions/setup-node@53a4f7c3ee89bd49776564f2e6b8c5dbfb39b68a
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install locked frontend dependencies
        shell: zsh {0}
        run: |
          set -euo pipefail
          npm_home="$GPTEASY_PRIVATE_DIR/npm"
          /bin/mkdir -p "$npm_home"
          /bin/chmod 700 "$npm_home"
          : > "$npm_home/user.npmrc"
          : > "$npm_home/global.npmrc"
          /bin/chmod 600 "$npm_home/user.npmrc" "$npm_home/global.npmrc"
          NPM_CONFIG_USERCONFIG="$npm_home/user.npmrc" \
          NPM_CONFIG_GLOBALCONFIG="$npm_home/global.npmrc" \
          NPM_CONFIG_REGISTRY="https://registry.npmjs.org/" \
            npm ci --ignore-scripts --no-audit --no-fund

      - name: Prepare native Rust target
        shell: zsh {0}
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          rustup target add "$RUST_TARGET"
          cargo metadata \
            --manifest-path src-tauri/Cargo.toml \
            --locked \
            --no-deps \
            >/dev/null

      - name: Initialize disposable OS user
        shell: zsh {0}
        run: |
          set -euo pipefail
          sudo zsh scripts/contracts/assert-macos-job-lifecycle.zsh \
            --action initialize \
            --state-path "$GPTEASY_PRIVATE_DIR/lifecycle-state.json"

      - name: Run official CLI and host canary parity as disposable user
        shell: zsh {0}
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          set -euo pipefail
          sudo zsh scripts/contracts/assert-macos-job-lifecycle.zsh \
            --action invoke \
            --state-path "$GPTEASY_PRIVATE_DIR/lifecycle-state.json" \
            --stdout-path "$GPTEASY_EVIDENCE_DIR/macos-host.json" \
            --stderr-path "$GPTEASY_PRIVATE_DIR/macos-host.stderr" \
            -- \
            /bin/zsh "$GITHUB_WORKSPACE/scripts/contracts/probe-macos-host.zsh" \
              --expected-version 0.146.1 \
              --expected-arch "$EXPECTED_ARCH"

      - name: Build, Developer ID sign, notarize, staple, and assess package
        shell: zsh {0}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          [[ -n "$APPLE_CERTIFICATE" ]]
          [[ -n "$APPLE_CERTIFICATE_PASSWORD" ]]
          [[ -n "$APPLE_SIGNING_IDENTITY" ]]
          [[ -n "$APPLE_API_ISSUER" ]]
          [[ -n "$APPLE_API_KEY" ]]
          [[ -n "$APPLE_API_KEY_ID" ]]

          certificate_path="$GPTEASY_PRIVATE_DIR/developer-id.p12"
          api_key_path="$GPTEASY_PRIVATE_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
          keychain_path="$GPTEASY_PRIVATE_DIR/gpteasy-signing.keychain-db"
          submission_path="$GPTEASY_PRIVATE_DIR/notary-submission.zip"
          keychain_password="Kc1!$(/usr/bin/openssl rand -base64 32 | /usr/bin/tr -d '\r\n')"

          function cleanup_signing_material() {
            /usr/bin/security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            /bin/rm -f \
              "$certificate_path" \
              "$api_key_path" \
              "$submission_path"
            keychain_password=""
          }
          trap cleanup_signing_material EXIT

          print -nr -- "$APPLE_CERTIFICATE" |
            /usr/bin/base64 -D > "$certificate_path"
          print -nr -- "$APPLE_API_KEY" > "$api_key_path"
          /bin/chmod 600 "$certificate_path" "$api_key_path"

          /usr/bin/security create-keychain \
            -p "$keychain_password" \
            "$keychain_path"
          /usr/bin/security set-keychain-settings \
            -lut 21600 \
            "$keychain_path"
          /usr/bin/security unlock-keychain \
            -p "$keychain_password" \
            "$keychain_path"
          /usr/bin/security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          /usr/bin/security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" \
            >/dev/null
          /usr/bin/security list-keychains \
            -d user \
            -s "$keychain_path"
          /usr/bin/security find-identity \
            -v \
            -p codesigning \
            "$keychain_path" |
            /usr/bin/grep -F "$APPLE_SIGNING_IDENTITY" \
            >/dev/null

          /usr/bin/env \
            -u APPLE_CERTIFICATE \
            -u APPLE_CERTIFICATE_PASSWORD \
            -u APPLE_API_ISSUER \
            -u APPLE_API_KEY \
            -u APPLE_API_KEY_ID \
            npm run tauri -- \
              build \
              --target "$RUST_TARGET" \
              --bundles app

          app_path="$(
            /usr/bin/find \
              "src-tauri/target/$RUST_TARGET/release/bundle/macos" \
              -maxdepth 1 \
              -type d \
              -name 'GPTEasy.app' \
              -print
          )"
          [[ -n "$app_path" && -d "$app_path" ]]

          /usr/bin/codesign \
            --force \
            --deep \
            --options runtime \
            --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "$app_path"
          /usr/bin/codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$app_path"

          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$app_path" \
            "$submission_path"
          /usr/bin/xcrun notarytool submit "$submission_path" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            >/dev/null
          /usr/bin/xcrun stapler staple "$app_path"
          /usr/bin/xcrun stapler validate "$app_path"
          /usr/sbin/spctl \
            --assess \
            --type execute \
            --verbose=4 \
            "$app_path"

          /bin/rm -f "$GPTEASY_ARTIFACT_PATH"
          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$app_path" \
            "$GPTEASY_ARTIFACT_PATH"
          print -r -- "GPTEASY_APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Install to current user and run path smoke
        shell: zsh {0}
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          set -euo pipefail
          state_path="$GPTEASY_PRIVATE_DIR/lifecycle-state.json"
          account_name=$(/usr/bin/plutil -extract account_name raw -o - "$state_path")
          account_home=$(/usr/bin/plutil -extract profile_path raw -o - "$state_path")
          installed_app="$account_home/Applications/GPTEasy.app"
          lifecycle_script="$GITHUB_WORKSPACE/scripts/contracts/assert-macos-job-lifecycle.zsh"

          sudo zsh "$lifecycle_script" \
            --action invoke \
            --state-path "$state_path" \
            -- \
            /bin/mkdir -p "$account_home/Applications"
          sudo zsh "$lifecycle_script" \
            --action invoke \
            --state-path "$state_path" \
            -- \
            /usr/bin/ditto "$GPTEASY_APP_PATH" "$installed_app"
          sudo zsh "$lifecycle_script" \
            --action invoke \
            --state-path "$state_path" \
            --stderr-path "$GPTEASY_PRIVATE_DIR/installed-gatekeeper.stderr" \
            -- \
            /usr/sbin/spctl \
              --assess \
              --type execute \
              --verbose=4 \
              "$installed_app"

          executable_name=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$installed_app/Contents/Info.plist"
          )
          installed_executable="$installed_app/Contents/MacOS/$executable_name"
          run_id="p1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$EXPECTED_ARCH"
          first_output="$GPTEASY_EVIDENCE_DIR/path-smoke-first.json"
          second_output="$GPTEASY_EVIDENCE_DIR/path-smoke-second.json"

          for output_path in "$first_output" "$second_output"; do
            sudo zsh "$lifecycle_script" \
              --action invoke \
              --state-path "$state_path" \
              --stdout-path "$output_path" \
              --stderr-path "$GPTEASY_PRIVATE_DIR/path-smoke.stderr" \
              -- \
              "$installed_executable" \
                phase1-path-smoke \
                "$run_id"
          done

          first_run_id=$(/usr/bin/plutil -extract run_id raw -o - "$first_output")
          second_run_id=$(/usr/bin/plutil -extract run_id raw -o - "$second_output")
          first_schema=$(/usr/bin/plutil -extract schema raw -o - "$first_output")
          second_schema=$(/usr/bin/plutil -extract schema raw -o - "$second_output")
          first_os=$(/usr/bin/plutil -extract os raw -o - "$first_output")
          second_os=$(/usr/bin/plutil -extract os raw -o - "$second_output")
          first_arch=$(/usr/bin/plutil -extract arch raw -o - "$first_output")
          second_arch=$(/usr/bin/plutil -extract arch raw -o - "$second_output")
          first_reopened=$(/usr/bin/plutil -extract reopened raw -o - "$first_output")
          second_reopened=$(/usr/bin/plutil -extract reopened raw -o - "$second_output")
          [[ "$first_run_id" == "$run_id" ]]
          [[ "$second_run_id" == "$run_id" ]]
          [[ "$first_schema" == "gpteasy.phase1.path-smoke.v1" ]]
          [[ "$second_schema" == "gpteasy.phase1.path-smoke.v1" ]]
          [[ "$first_os" == macos ]]
          [[ "$second_os" == macos ]]
          [[ "$first_arch" == "$EXPECTED_SMOKE_ARCH" ]]
          [[ "$second_arch" == "$EXPECTED_SMOKE_ARCH" ]]
          [[ "$first_reopened" == false ]]
          [[ "$second_reopened" == true ]]

          profile_sha256=$(
            print -nr -- "$account_home" |
              /usr/bin/shasum -a 256 |
              /usr/bin/awk '{print $1}'
          )
          install_evidence="$GPTEASY_EVIDENCE_DIR/install.json"
          print -r -- "{\"schema_version\":1,\"install\":{\"scope\":\"currentUser\",\"root_kind\":\"HOME_APPLICATIONS\",\"profile_id_sha256\":\"${profile_sha256}\",\"absolute_path_redacted\":true,\"gatekeeper_accepted\":true},\"path_smoke\":{\"outcome\":\"passed\",\"os_name\":\"macos\",\"architecture\":\"${EXPECTED_SMOKE_ARCH}\",\"root_kind\":\"app_local_data_dir\",\"reopened\":true,\"absolute_path_redacted\":true},\"marker_correlated\":true}" \
            > "$install_evidence"
          /bin/chmod 600 "$install_evidence"
          account_name=""
          account_home=""
          installed_app=""
          installed_executable=""

      - name: Finalize run-scoped app, account, and profile cleanup
        id: lifecycle_cleanup
        if: always()
        continue-on-error: true
        shell: zsh {0}
        run: |
          set -euo pipefail
          sudo zsh scripts/contracts/assert-macos-job-lifecycle.zsh \
            --action finalize \
            --state-path "$GPTEASY_PRIVATE_DIR/lifecycle-state.json" \
            --evidence-path "$GPTEASY_EVIDENCE_DIR/lifecycle.json"

      - name: Verify package and finalized lifecycle
        id: package_verification
        if: always()
        shell: zsh {0}
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          set -euo pipefail
          output=""
          status=0
          output=$(
            zsh scripts/contracts/run-macos.zsh \
              --app-path "$GPTEASY_APP_PATH" \
              --artifact-path "$GPTEASY_ARTIFACT_PATH" \
              --install-evidence-path "$GPTEASY_EVIDENCE_DIR/install.json" \
              --lifecycle-evidence-path "$GPTEASY_EVIDENCE_DIR/lifecycle.json" \
              --expected-arch "$EXPECTED_ARCH"
          ) || status="$?"
          print -r -- "$output" \
            > "$GPTEASY_EVIDENCE_DIR/package-verification.json"
          [[ "$status" -eq 0 ]]
          [[ "$(
            /usr/bin/plutil \
              -extract strict_gate_eligible \
              raw \
              -o - \
              "$GPTEASY_EVIDENCE_DIR/package-verification.json"
          )" == true ]]

          artifact_sha256=$(
            /usr/bin/shasum -a 256 "$GPTEASY_ARTIFACT_PATH" |
              /usr/bin/awk '{print $1}'
          )
          strict_pass="$GPTEASY_EVIDENCE_DIR/strict-pass.json"
          print -r -- "{\"schema_version\":1,\"phase\":\"01\",\"target_architecture\":\"${EXPECTED_ARCH}\",\"repository\":\"${GITHUB_REPOSITORY}\",\"commit\":\"${GITHUB_SHA}\",\"run_id\":\"${GITHUB_RUN_ID}\",\"run_attempt\":${GITHUB_RUN_ATTEMPT},\"job\":\"${GITHUB_JOB}\",\"artifact_sha256\":\"${artifact_sha256}\",\"cleanup_attested\":true,\"codesign_verified\":true,\"notary_stapled\":true,\"gatekeeper_accepted\":true,\"current_user_install\":true}" \
            > "$strict_pass"
          /bin/chmod 600 "$strict_pass"

          /bin/rm -f "$GPTEASY_EVIDENCE_BUNDLE"
          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$GPTEASY_EVIDENCE_DIR" \
            "$GPTEASY_EVIDENCE_BUNDLE"
          print -r -- "artifact=$GPTEASY_ARTIFACT_PATH" >> "$GITHUB_OUTPUT"
          print -r -- "bundle=$GPTEASY_EVIDENCE_BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Remove private signing and lifecycle state
        if: always()
        shell: zsh {0}
        run: |
          set -euo pipefail
          if [[ "$GPTEASY_PRIVATE_DIR" == "$RUNNER_TEMP"/gpteasy-private-* ]]; then
            /bin/rm -rf "$GPTEASY_PRIVATE_DIR"
          else
            exit 5
          fi

      - name: Upload app and evidence bundle
        uses: actions/upload-artifact@3cea5372237819ed00197afe530f5a7ea3e805c8
        with:
          name: phase1-macos-${{ matrix.expected_arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.package_verification.outputs.artifact }}
            ${{ steps.package_verification.outputs.bundle }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@cb7e54520ab2c01f0f31fb1838b2e05f204ce3e7
        with:
          subject-path: |
            ${{ steps.package_verification.outputs.artifact }}
            ${{ steps.package_verification.outputs.bundle }}
