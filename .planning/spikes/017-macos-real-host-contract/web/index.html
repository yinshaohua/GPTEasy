<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPTEasy macOS 真实宿主契约</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">SPIKE 017</p>
          <h1>macOS 真实宿主契约</h1>
          <p>探测当前用户安装范围、Codex 应用与进程，并记录关闭窗口和更新 canary 的可观察证据。</p>
        </div>
        <button id="refresh">重新探测</button>
      </header>

      <section class="metrics" id="metrics"></section>

      <section>
        <h2>宿主快照</h2>
        <pre id="snapshot">正在探测……</pre>
      </section>

      <section>
        <h2>当前用户更新 canary</h2>
        <p>在旧版本写入，替换应用包并启动新版本后读取；值仍存在才说明应用包更新没有覆盖用户数据目录。</p>
        <div class="actions">
          <input id="canary" value="spike-017-state-survives-update">
          <button id="write-canary">写入</button>
          <button id="read-canary" class="secondary">读取</button>
        </div>
        <pre id="canary-result">尚未操作。</pre>
      </section>

      <section>
        <h2>人工检查</h2>
        <ol>
          <li>确认菜单栏托盘图标可见。</li>
          <li>关闭窗口，确认进程仍存在。</li>
          <li>从托盘选择“显示契约探针”，确认窗口重新出现。</li>
          <li>仅通过托盘“明确退出”结束应用。</li>
        </ol>
        <button id="export">导出取证证据</button>
        <pre id="export-result">尚未导出。</pre>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
